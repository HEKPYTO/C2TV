name: Action smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  adopt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run C2TV as a caller would
        uses: ./
        with:
          fixture: fixtures/good/crc32
